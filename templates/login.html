<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <title>Login · VEHICLE REGISTRATION SYSTEM</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Inter:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body style="display:flex; align-items:center; justify-content:center; height:100vh;">

  <div class="card" style="width: 400px; padding: 40px;">
    <div style="text-align:center; margin-bottom: 30px;">
      <h1 style="color: var(--accent); font-size: 20px;">◈ VEHICLE REGISTRATION SYSTEM </h1>
      <p class="muted">Sign in to your account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="badge-status stolen" style="display:block; margin-bottom:15px; text-align:center;">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" action="/login">
      <div class="input-group">
        <input type="text" name="username" class="form-input" required placeholder=" ">
        <label class="floating-label">Username</label>
      </div>
      <div class="input-group">
        <input type="password" name="password" class="form-input" required placeholder=" ">
        <label class="floating-label">Password</label>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Sign In</button>
    </form>


  </div>

</body>

</html>
